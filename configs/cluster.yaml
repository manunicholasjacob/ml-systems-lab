# Three genuinely different machines, one sweep, run at once.
#
# This is the config that demonstrates the scheduler, as opposed to the containerisation
# study in configs/containerization.yaml, which deliberately arranges for the arms *not*
# to overlap because they share a CPU. Here they do not share anything, so they overlap,
# and the sweep takes about as long as its slowest device rather than the sum of all of
# them.
#
#   laptop        Windows, i7-12700H, the machine running the harness
#   pi5           Raspberry Pi 5, 2 GB, Cortex-A76, over SSH on the tailnet
#   k8s-cpu4      a Kubernetes pod on the laptop's Linux side, 4 core CFS quota
#
# Three device kinds, three CPU architectures' worth of difference between the extremes,
# and no branch anywhere in the backends to tell them apart.
#
# Two things in here are not decoration:
#
#   max_concurrency: 1 on pi5. The 2 GB board with no swap has hung hard enough to need a
#   physical power cycle when given two heavy jobs at once. This is the number that stops
#   that, and 1 is also the default for anything that has not said otherwise.
#
#   resource_group: laptop-cpu on the laptop and the pod. They are one i7-12700H wearing
#   two device ids. Without the group they would run at the same time and measure each
#   other. The Pi is a different machine, so it is in no group and overlaps freely with
#   both, which is the entire point of running concurrently at all.
#
# Run it:
#   mlsys run configs/cluster.yaml --concurrent --prometheus-port 9109
#
# Expect the clock check to say something about the Pi. Its offset is recorded either way.

experiment: cluster
output_dir: runs/cluster

devices:
  laptop:
    kind: local
    dram_peak_GBs: 53.9
    resource_group: laptop-cpu
    max_concurrency: 1
    llamacpp:
      bin_dir: C:/llmpc/bin

  pi5:
    host: 100.98.217.64
    user: manu
    identity_file: ~/.ssh/raspberry_pi_key
    python: python3
    dram_peak_GBs: 13.98
    # One job at a time, and mean it. See above.
    max_concurrency: 1
    max_transport_failures: 3
    recovery_after_s: 120
    llamacpp:
      bin_dir: ~/llm/llama.cpp/build/bin

  k8s-cpu4:
    kind: k8s
    kubectl: ["wsl", "-d", "Ubuntu", "--exec", "k3s", "kubectl"]
    namespace: mlsyslab
    pod: mlsyslab-cpu4
    image: docker.io/library/mlsyslab-agent:0.2.0
    dram_peak_GBs: 53.9
    resource_group: laptop-cpu
    cpu_limit: "4"
    cpu_request: "4"
    memory_request: 2Gi
    memory_limit: 4Gi
    host_mounts:
      - host_path: /home/manu/models
        mount_path: /models
        read_only: true
    llamacpp:
      bin_dir: /usr/local/bin

models:
  qwen0.5b-q4km:
    quantization: Q4_K_M
    params: 0.5
    paths:
      laptop: C:/llmpc/models/qwen0.5b-q4km.gguf
      pi5: ~/llm/models/qwen0.5b-q4km.gguf
      k8s-cpu4: /models/qwen0.5b-q4km.gguf

  qwen0.5b-q2k:
    quantization: Q2_K
    params: 0.5
    paths:
      laptop: C:/llmpc/models/qwen0.5b-q2k.gguf
      pi5: ~/llm/models/qwen0.5b-q2k.gguf
      k8s-cpu4: /models/qwen0.5b-q2k.gguf

defaults:
  backend: llamacpp
  repetitions: 3

matrix:
  - devices: [laptop, pi5, k8s-cpu4]
    models: [qwen0.5b-q4km, qwen0.5b-q2k]
    modes: [throughput]
    threads: [4]
    prompt_tokens: [128]
    output_tokens: [64]
