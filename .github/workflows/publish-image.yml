# The agent image, published to ghcr.io/manunicholasjacob/mlsyslab-agent.
#
# GGML_NATIVE=OFF is the whole point of this workflow. The Dockerfile defaults to ON
# because a local build exists to measure the machine it is built on; an image that
# other people pull must not be tuned for a CI runner's CPU, or it dies with SIGILL on
# any machine without the same instruction-set extensions.
#
# Each platform builds on a native runner (arm64 under QEMU would compile llama.cpp
# for hours) and is smoke-tested before anything is pushed. Pushing happens only for a
# published release or a manual run that asks for it; a pull request that touches the
# image builds and tests both platforms and pushes nothing.
name: publish-image

on:
  release:
    types: [published]
  pull_request:
    paths:
      - "docker/**"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image to GHCR (otherwise build and test only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/manunicholasjacob/mlsyslab-agent
  PUSH: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.push) }}

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: GGML_NATIVE=OFF
          load: true
          tags: mlsyslab-agent:test
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Smoke-test the image
        run: |
          docker run --rm mlsyslab-agent:test sh -ec '
            python3 -c "import json, sys; print(sys.version)"
            tar --version > /dev/null
            for bin in llama-bench llama-server llama-cli; do
              command -v "$bin" > /dev/null
              if ldd "$(command -v "$bin")" | grep -q "not found"; then
                echo "$bin has unresolved libraries"; ldd "$(command -v "$bin")"; exit 1
              fi
            done
            llama-bench --help > /dev/null
            echo "llama.cpp $(cat /etc/mlsyslab-llamacpp-commit)"
          '

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        if: env.PUSH == 'true'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: GGML_NATIVE=OFF
          cache-from: type=gha,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Record the digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
          echo "PLATFORM_SLUG=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_ENV"

      - name: Upload the digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ env.PLATFORM_SLUG }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # One multi-platform tag over the per-platform digests.
  merge:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.push)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Create the manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
