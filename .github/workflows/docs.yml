# Builds the documentation site on every pull request that could change it, and
# deploys it to GitHub Pages from main. The build is --strict, so a broken link, a
# missing page or a snippet pointing at a moved file fails here rather than on the site.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "configs/**"
      - "tools/gen_config_gallery.py"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "docker/README.md"
      - "results/README.md"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "configs/**"
      - "tools/gen_config_gallery.py"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "docker/README.md"
      - "results/README.md"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
      - name: The config gallery is current
        run: python tools/gen_config_gallery.py --check
      - name: Build
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
