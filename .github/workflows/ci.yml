name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12", "3.13"]
        exclude:
          # macos-latest runners are arm64; 3.9 wheels are not published for it.
          - os: macos-latest
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke-test the CLI
        run: |
          mlsys --version
          mlsys probe

  # The measurement path must run on a machine with nothing installed beyond Python:
  # that is precisely the situation on the device under test. This job proves the agent,
  # devices, backends, config and schema all import and function with zero dependencies.
  no-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . --no-deps
      - name: Confirm the optional stack is absent
        run: |
          python - <<'EOF'
          import importlib.util, sys
          for mod in ("numpy", "matplotlib", "yaml", "onnxruntime"):
              if importlib.util.find_spec(mod) is not None:
                  sys.exit(f"{mod} is installed; this job would prove nothing")
          print("scientific stack absent, as intended")
          EOF
      - name: Agent and measurement core work bare
        run: |
          python - <<'EOF'
          import json, subprocess, sys

          # The agent runs a task end to end with no dependencies.
          task = {"kind": "command", "argv": [sys.executable, "-c", "print('ok')"],
                  "sample_power": False}
          out = subprocess.run([sys.executable, "-m", "mlsyslab.agent", "-"],
                               input=json.dumps(task).encode(), capture_output=True,
                               check=True)
          text = out.stdout.decode()
          assert "===MLSYSLAB-RESULT-BEGIN===" in text
          payload = json.loads(text.split("===MLSYSLAB-RESULT-BEGIN===")[1]
                               .split("===MLSYSLAB-RESULT-END===")[0])
          assert payload["status"] == "ok", payload

          # JSON configs load without PyYAML.
          from mlsyslab.config import load
          import tempfile, os
          cfg = {"experiment": "ci", "devices": {"local": {"kind": "local"}},
                 "models": {"m": {"path": "/nonexistent.gguf"}},
                 "matrix": [{"devices": ["local"], "models": ["m"],
                             "output_tokens": [16]}]}
          with tempfile.NamedTemporaryFile("w", suffix=".json", delete=False) as fh:
              json.dump(cfg, fh); path = fh.name
          config = load(path); os.unlink(path)
          assert len(config.specs) == 1
          print("bare measurement core: ok")
          EOF
      - run: mlsys --version
