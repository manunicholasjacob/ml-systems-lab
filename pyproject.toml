[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-systems-lab"
version = "0.2.2"
description = "A reproducible benchmarking framework for ML inference across laptops, single-board computers and servers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Manu Nicholas Jacob" }]
keywords = [
    "benchmark", "inference", "llama.cpp", "onnxruntime", "edge-ai",
    "raspberry-pi", "energy", "latency", "ttft", "quantization", "reproducibility",
    "llm-inference", "kubernetes", "prometheus", "benchmarking", "power-measurement",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
    "Topic :: System :: Monitoring",
]
# The measurement core is pure standard library on purpose: it has to run unmodified on
# a 2 GB Raspberry Pi over SSH, where installing a scientific stack is neither cheap nor
# always possible. numpy and matplotlib are ordinary dependencies so that analysis and
# plotting work on first install, and a CI job proves the core still imports without them.
dependencies = ["numpy>=1.20", "matplotlib>=3.4", "PyYAML>=5.4"]

[project.optional-dependencies]
# psutil is test-only: the Windows per-core CPU path is cross-checked against it. The
# measurement core itself stays standard-library-only.
dev = ["pytest>=7", "psutil>=5.9"]
onnx = ["onnxruntime>=1.15"]
# The documentation site (mkdocs.yml). Upper bounds because MkDocs 2 and Material 10
# are not drop-in upgrades; CI builds with --strict, so a bad combination fails there.
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]

[project.urls]
Homepage = "https://github.com/manunicholasjacob/ml-systems-lab"
Issues = "https://github.com/manunicholasjacob/ml-systems-lab/issues"
Changelog = "https://github.com/manunicholasjacob/ml-systems-lab/blob/main/CHANGELOG.md"
"Write-up" = "https://manunicholasjacob.com/writing/quota-not-the-container/"
Documentation = "https://manunicholasjacob.com/ml-systems-lab/"
DOI = "https://doi.org/10.5281/zenodo.21867055"

[project.scripts]
mlsys = "mlsyslab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
